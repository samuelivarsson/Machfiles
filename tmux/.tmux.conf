# Show the full per-project session name in the status bar (tmux default is 10)
set -g status-left-length 30

# Forward modified keys (Shift+Enter, Ctrl+Enter, etc.) from the terminal through
# to programs like Claude Code. kitty emits these via the CSI-u / kitty keyboard
# protocol; without this, tmux collapses Shift+Enter down to a plain Enter and
# Claude submits instead of inserting a newline.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
